<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Application Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Custom Dropdown Arrow */
        select {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%23475569' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3E%3C/svg%3E");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.2em 1.2em;
            padding-right: 2.5rem !important;
        }

        /* Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }

        /* Input focus transitions */
        .smart-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .smart-input:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 text-slate-800 relative">

    <!-- Animated Background Blobs -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-72 h-72 sm:w-96 sm:h-96 bg-teal-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-40 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-72 h-72 sm:w-96 sm:h-96 bg-emerald-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-72 h-72 sm:w-96 sm:h-96 bg-cyan-300 rounded-full mix-blend-multiply filter blur-[80px] opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Form Container -->
    <div class="bg-white/70 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_40px_rgb(0,0,0,0.06)] w-full max-w-4xl relative z-10 border border-white/60">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-br from-teal-600 via-teal-500 to-emerald-500 px-8 py-12 text-center text-white relative overflow-hidden rounded-t-[2rem]">
            <div class="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] opacity-30"></div>
            
            <div class="relative z-10 flex flex-col items-center fade-in-up">
                <div class="bg-white/20 p-4 rounded-3xl mb-5 backdrop-blur-md shadow-inner border border-white/30">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl sm:text-4xl font-extrabold mb-2 tracking-tight">Membership Application</h1>
                <p class="text-teal-50 font-medium text-sm sm:text-base tracking-widest uppercase opacity-90">সদস্যপদ আবেদন ফরম</p>
            </div>
        </div>

        <form method="post" name="membershipForm" id="membershipForm" class="p-6 sm:p-10 space-y-8 bg-transparent">
            
            <!-- Personal Information Card -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 fade-in-up delay-100">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                    <div class="bg-teal-50 p-2 rounded-xl text-teal-600">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-800 leading-none">Personal Information</h3>
                        <p class="text-xs text-slate-500 mt-1">ব্যক্তিগত তথ্য</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="flex flex-col sm:col-span-2">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Full Name / পূর্ণ নাম <span class="text-red-500">*</span></label>
                        <input type="text" name="FullName" placeholder="e.g. Mohammad Rameez Imdad" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Father’s Name / পিতার নাম <span class="text-red-500">*</span></label>
                        <input type="text" name="FatherName" placeholder="Enter father's name" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Mother’s Name / মাতার নাম <span class="text-red-500">*</span></label>
                        <input type="text" name="MotherName" placeholder="Enter mother's name" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Date of Birth / জন্ম তারিখ <span class="text-red-500">*</span></label>
                        <input type="date" name="DateOfBirth" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Gender / লিঙ্গ <span class="text-red-500">*</span></label>
                        <select name="Gender" required class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5 appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male / পুরুষ</option>
                            <option value="Female">Female / নারী</option>
                            <option value="Other">Other / অন্যান্য</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Blood Group / রক্তের গ্রুপ <span class="text-red-500">*</span></label>
                        <select name="BloodGroup" required class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5 appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Nationality / জাতীয়তা <span class="text-red-500">*</span></label>
                        <input type="text" name="Nationality" value="Bangladeshi" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 outline-none px-4 py-3.5">
                    </div>
                </div>
            </div>

            <!-- Contact Details Card -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 fade-in-up delay-200">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                    <div class="bg-emerald-50 p-2 rounded-xl text-emerald-600">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-800 leading-none">Contact Details</h3>
                        <p class="text-xs text-slate-500 mt-1">যোগাযোগের ঠিকানা</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Mobile Number / মোবাইল নম্বর <span class="text-red-500">*</span></label>
                        <input type="tel" name="MobileNumber" placeholder="e.g. 01XXXXXXXXX" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Email Address / ই-মেইল</label>
                        <input type="email" name="Email" placeholder="example@email.com" 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Present Address / বর্তমান ঠিকানা <span class="text-red-500">*</span></label>
                        <textarea name="PresentAddress" rows="3" placeholder="Enter your full present address" required 
                                  class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 outline-none px-4 py-3.5 resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Membership Info Card -->
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100 fade-in-up delay-300">
                <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                    <div class="bg-cyan-50 p-2 rounded-xl text-cyan-600">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-slate-800 leading-none">Membership Info</h3>
                        <p class="text-xs text-slate-500 mt-1">সদস্যপদ তথ্য</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    
                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Serial No / সিরিয়াল নম্বর</label>
                        <input type="text" name="SerialNumber" id="serialNo" readonly
                               class="w-full bg-slate-100/70 border border-slate-200 text-teal-700 font-mono font-bold text-sm rounded-2xl px-4 py-3.5 shadow-inner cursor-not-allowed outline-none select-all tracking-wider">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Application Date / আবেদনের তারিখ <span class="text-red-500">*</span></label>
                        <input type="date" name="ApplicationDate" id="appDate" required readonly
                               class="w-full bg-slate-100/70 border border-slate-200 text-slate-500 text-sm rounded-2xl px-4 py-3.5 shadow-inner cursor-not-allowed outline-none select-none">
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Educational Qualification / শিক্ষাগত যোগ্যতা <span class="text-red-500">*</span></label>
                        <input type="text" name="Education" placeholder="Highest degree/qualification" required 
                               class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-500 outline-none px-4 py-3.5">
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label class="text-sm font-semibold text-slate-700 mb-2">Membership Type / সদস্যের ধরন <span class="text-red-500">*</span></label>
                        <select name="MembershipType" required class="smart-input w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-2xl focus:bg-white focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-500 outline-none px-4 py-3.5 appearance-none cursor-pointer">
                            <option value="" disabled selected>Select Membership Type</option>
                            <option value="General Member">General Member / সাধারণ সদস্য</option>
                            <option value="Volunteer">Volunteer / স্বেচ্ছাসেবক</option>
                            <option value="Sports Member">Sports Member / ক্রীড়া সদস্য</option>
                            <option value="Blood Donor">Blood Donor / রক্তদাতা</option>
                            <option value="Education Volunteer">Education Volunteer / শিক্ষাসেবা সদস্য</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="pt-2 fade-in-up delay-400">
                <label class="flex items-start bg-gradient-to-r from-teal-50 to-emerald-50 p-5 rounded-2xl border border-teal-100/50 mb-6 cursor-pointer hover:shadow-md transition-shadow duration-300 group">
                    <div class="flex items-center h-6 mt-0.5">
                        <input id="agreement" name="Agreement" type="checkbox" required 
                               class="w-5 h-5 text-teal-600 bg-white border-slate-300 rounded focus:ring-teal-500 focus:ring-2 cursor-pointer transition duration-200">
                    </div>
                    <div class="ml-3.5">
                        <span class="font-bold text-slate-800 block mb-1 group-hover:text-teal-700 transition-colors">
                            Confirmation / সম্মতি <span class="text-red-500">*</span>
                        </span>
                        <p class="text-slate-600 leading-relaxed text-sm">
                            I agree to follow the rules and regulations of the organization.<br>
                            আমি সংগঠনের সকল নিয়ম ও শৃঙ্খলা মেনে চলতে সম্মত।
                        </p>
                    </div>
                </label>

                <button type="submit" id="submitBtn" class="group relative w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-lg py-4.5 px-6 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 ease-in-out flex justify-center items-center overflow-hidden h-14">
                    <!-- Button Glow Effect -->
                    <div class="absolute inset-0 bg-gradient-to-r from-teal-500 to-emerald-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-0"></div>
                    
                    <span id="btnText" class="relative z-10">Submit Application</span>
                    
                    <svg id="btnArrow" class="relative z-10 ml-2 w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    
                    <!-- Loading spinner -->
                    <svg id="btnSpinner" class="animate-spin ml-3 h-5 w-5 text-white hidden relative z-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>

        </form>
    </div>

    <!-- Custom Modal Popup -->
    <div id="messageModal" class="fixed inset-0 z-50 hidden flex items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="relative p-4 w-full max-w-sm transition-transform transform scale-95 duration-300 ease-out" id="modalContent">
            <div class="relative bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-white">
                <div class="p-8 text-center">
                    <div id="modalIconContainer" class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 shadow-inner">
                        <svg id="modalIcon" class="h-10 w-10 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <h3 id="modalTitle" class="mb-2 text-2xl font-extrabold text-slate-800">Success!</h3>
                    <p id="modalMessage" class="mb-8 text-slate-500 font-medium leading-relaxed">Thank you! Your application has been submitted successfully.</p>
                    <button id="closeModalBtn" type="button" class="w-full text-white bg-slate-900 hover:bg-slate-800 focus:ring-4 focus:outline-none focus:ring-slate-300 font-bold rounded-2xl text-lg px-6 py-4 text-center transition-all duration-300 hover:shadow-lg">
                        Done
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date automatically
        document.getElementById('appDate').valueAsDate = new Date();

        // Generate Unique Serial Number (e.g., MEM-202608-1234)
        function generateSerialNumber() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const randomCode = Math.floor(1000 + Math.random() * 9000); // 4 digit random number
            return `MEM-${year}${month}-${randomCode}`;
        }
        document.getElementById('serialNo').value = generateSerialNumber();

        const scriptURL = 'https://script.google.com/macros/s/AKfycbxRca55blXybvtaOHjLXCLkUHiGHgAMlWWSZe8G84i0ImCJLlFyBcsT8Ig3w3Dl7JGnOA/exec';
        const form = document.forms['membershipForm'];
        
        // Modal elements
        const modal = document.getElementById('messageModal');
        const modalContent = document.getElementById('modalContent');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalIconContainer = document.getElementById('modalIconContainer');
        const modalIcon = document.getElementById('modalIcon');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        // Button elements
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnArrow = document.getElementById('btnArrow');
        const btnSpinner = document.getElementById('btnSpinner');

        let isSuccess = false;

        function showModal(title, message, type) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (type === 'error') {
                modalIconContainer.classList.replace('bg-emerald-100', 'bg-red-100');
                modalIcon.classList.replace('text-emerald-600', 'text-red-600');
                modalIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />`;
            } else {
                modalIconContainer.classList.replace('bg-red-100', 'bg-emerald-100');
                modalIcon.classList.replace('text-red-600', 'text-emerald-600');
                modalIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />`;
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        closeModalBtn.addEventListener('click', () => {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (isSuccess) {
                    window.location.reload();
                }
            }, 300); // Wait for transition to finish
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Set loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-90', 'cursor-not-allowed');
            btnText.textContent = "Submitting...";
            btnArrow.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    isSuccess = true;
                    showModal('Awesome!', 'Your application has been submitted successfully.', 'success');
                })
                .catch(error => {
                    isSuccess = false;
                    console.error('Error!', error.message);
                    showModal('Submission Failed', 'Check your internet connection and try again.', 'error');
                })
                .finally(() => {
                    // Reset loading state
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-90', 'cursor-not-allowed');
                    btnText.textContent = "Submit Application";
                    btnArrow.classList.remove('hidden');
                    btnSpinner.classList.add('hidden');
                });
        });
    </script>
</body>
</html>
